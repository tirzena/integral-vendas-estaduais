name: Validate Vendas Estaduais Node
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint source (functional errors only)
        run: npx eslint src --quiet --rule 'prettier/prettier: off'
      - name: Build Hostinger Node
        run: npm run build:hostinger
      - name: Verify Node entrypoint
        run: test -f .output/server/index.mjs
