name: Validate Vendas Estaduais Node
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit all dependencies (report only)
        run: npm audit --audit-level=high || true
      - name: "Lint source - functional errors only"
        if: ${{ !cancelled() }}
        run: >-
          npx eslint src --quiet --rule '@typescript-eslint/no-explicit-any: off'
      - name: Unit tests
        if: ${{ !cancelled() }}
        run: npx vitest run
      - name: Build Hostinger Node
        if: ${{ !cancelled() }}
        run: npm run build:hostinger
      - name: Verify Node entrypoint
        if: ${{ !cancelled() }}
        run: test -f .output/server/index.mjs
