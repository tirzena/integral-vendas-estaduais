<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620"><title>Visão interna e administração — ilustração de uso</title><desc>Quatro etapas ilustrativas. As instruções completas estão no texto do manual.</desc><rect width="960" height="620" rx="20" fill="#061014"/><g font-family="Arial, sans-serif"><rect x="0" y="0" width="960" height="65" rx="20" fill="#0e2025"/><circle cx="30" cy="32" r="6" fill="#f17373"/><circle cx="50" cy="32" r="6" fill="#e4be69"/><circle cx="70" cy="32" r="6" fill="#43d6a5"/><text x="102" y="39" font-size="16" font-weight="700" fill="#eef6f6">SISTEMA INTEGRAL</text><text x="690" y="39" font-size="12" fill="#8fa8b0">MANUAL · EXEMPLO ILUSTRATIVO</text><rect x="15" y="82" width="165" height="520" rx="12" fill="#0b1b20"/><text x="34" y="115" font-size="12" fill="#7c969e">NAVEGAÇÃO</text><rect x="25" y="133" width="145" height="34" rx="7" fill="#10252b"/><text x="37" y="155" font-size="14" fill="#a8bec4">Visão geral</text><rect x="25" y="176" width="145" height="34" rx="7" fill="#10252b"/><text x="37" y="198" font-size="14" fill="#a8bec4">Clientes</text><rect x="25" y="219" width="145" height="34" rx="7" fill="#10252b"/><text x="37" y="241" font-size="14" fill="#a8bec4">Catálogo</text><rect x="25" y="262" width="145" height="34" rx="7" fill="#10252b"/><text x="37" y="284" font-size="14" fill="#a8bec4">Pedidos</text><rect x="25" y="305" width="145" height="34" rx="7" fill="#10252b"/><text x="37" y="327" font-size="14" fill="#a8bec4">Aprovações</text><rect x="25" y="348" width="145" height="34" rx="7" fill="#10252b"/><text x="37" y="370" font-size="14" fill="#a8bec4">Entregas</text><rect x="25" y="391" width="145" height="34" rx="7" fill="#10252b"/><text x="37" y="413" font-size="14" fill="#a8bec4">Financeiro</text><rect x="25" y="434" width="145" height="34" rx="7" fill="#163e36"/><text x="37" y="456" font-size="14" fill="#5ae0b6">Como usar</text><text x="205" y="112" font-size="22" fill="#f0f6f6">Visão interna e administração</text><rect x="205" y="165" width="345" height="163" rx="12" fill="#102229" stroke="#25434b"/><circle cx="233" cy="194" r="15" fill="#39d5a2"/><text x="228" y="200" font-size="16" font-weight="700" fill="#042018">1</text><text x="259" y="193" font-size="16" fill="#eef6f6">Confira a conta</text><text x="222" y="248" font-size="14" fill="#a5bcc4">Confirme que está na Direção Geral e em</text><text x="222" y="269" font-size="14" fill="#a5bcc4">sua conta administrativa real.</text><rect x="570" y="165" width="345" height="163" rx="12" fill="#102229" stroke="#25434b"/><circle cx="598" cy="194" r="15" fill="#39d5a2"/><text x="593" y="200" font-size="16" font-weight="700" fill="#042018">2</text><text x="624" y="193" font-size="16" fill="#eef6f6">Escolha a ferramenta</text><text x="587" y="248" font-size="14" fill="#a5bcc4">Abra Visão interna (admin) e selecione a</text><text x="587" y="269" font-size="14" fill="#a5bcc4">função necessária; confira o alcance de</text><text x="587" y="290" font-size="14" fill="#a5bcc4">qualquer alteração antes de executá-la.</text><rect x="205" y="346" width="345" height="163" rx="12" fill="#102229" stroke="#25434b"/><circle cx="233" cy="375" r="15" fill="#39d5a2"/><text x="228" y="381" font-size="16" font-weight="700" fill="#042018">3</text><text x="259" y="374" font-size="16" fill="#eef6f6">Revise os vínculos</text><text x="222" y="429" font-size="14" fill="#a5bcc4">Quando a rotina envolve membro, confira</text><text x="222" y="450" font-size="14" fill="#a5bcc4">cargos, categoria, produtos, estoque e</text><text x="222" y="471" font-size="14" fill="#a5bcc4">sistemas concedidos.</text><rect x="570" y="346" width="345" height="163" rx="12" fill="#102229" stroke="#25434b"/><circle cx="598" cy="375" r="15" fill="#39d5a2"/><text x="593" y="381" font-size="16" font-weight="700" fill="#042018">4</text><text x="624" y="374" font-size="16" fill="#eef6f6">Confira o histórico</text><text x="587" y="429" font-size="14" fill="#a5bcc4">Depois da alteração, consulte o registro</text><text x="587" y="450" font-size="14" fill="#a5bcc4">e seu histórico e valide o resultado no</text><text x="587" y="471" font-size="14" fill="#a5bcc4">perfil apropriado. Superadmin pos…</text><rect x="205" y="543" width="710" height="48" rx="10" fill="#11352d"/><text x="223" y="573" font-size="14" fill="#72e5bd">Confira os dados, a permissão e o resultado antes de concluir.</text></g></svg>